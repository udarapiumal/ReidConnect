# ==========================================
# PROD PROFILE - Production VPS settings
# ==========================================
# Activate with: SPRING_PROFILES_ACTIVE=prod
# Set secrets via environment variables on the VPS

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reidconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate — validate only, never auto-modify schema
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# JWT secret (MUST be set via env var)
security.jwt.secret-key=${JWT_SECRET}

# Mail credentials (MUST be set via env var)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Upload directory — absolute path on VPS
app.upload-dir=${UPLOAD_DIR:/opt/reidconnect/uploads}

# Static resource serving (serve from external uploads folder)
spring.web.resources.static-locations=file:${UPLOAD_DIR:/opt/reidconnect/uploads}/

# Frontend / Backend base URLs (set to your VPS domain)
app.frontend-url=${FRONTEND_URL:https://YOUR_FRONTEND_DOMAIN_HERE}
app.backend-url=${BACKEND_URL:https://YOUR_BACKEND_DOMAIN_HERE}

# CORS allowed origins (production domains)
app.cors.allowed-origins=${CORS_ORIGINS:https://YOUR_FRONTEND_DOMAIN_HERE}

# Logging
logging.level.root=INFO
logging.level.reidConnect.backend=INFO
